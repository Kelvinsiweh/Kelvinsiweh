<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70A5FD; }
    .lang-label { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #E2E8F0; }
    .lang-pct { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #94A3B8; }
    .bg { fill: #0F172A; stroke: #1E293B; stroke-width: 1.5px; rx: 10px; }
  </style>
  <rect class="bg" width="494" height="194" x="0.5" y="0.5" />
  <g transform="translate(25, 32)">
    <text class="header" x="0" y="0">Top Language Ecosystems</text>
  </g>
  <!-- Multi-colored progress bar -->
  <g transform="translate(25, 52)">
    <rect width="170" height="9" rx="4" fill="#3178C6" />
    <rect x="175" width="160" height="9" rx="4" fill="#3572A5" />
    <rect x="340" width="105" height="9" rx="4" fill="#4F5D95" />
  </g>
  <g transform="translate(25, 85)">
    <!-- TypeScript -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="5" fill="#3178C6" />
      <text class="lang-label" x="20" y="10">TypeScript</text>
      <text class="lang-pct" x="420" y="10" text-anchor="end">38.4%</text>
    </g>
    <!-- Python -->
    <g transform="translate(0, 26)">
      <circle cx="6" cy="6" r="5" fill="#3572A5" />
      <text class="lang-label" x="20" y="10">Python</text>
      <text class="lang-pct" x="420" y="10" text-anchor="end">35.8%</text>
    </g>
    <!-- PHP -->
    <g transform="translate(0, 52)">
      <circle cx="6" cy="6" r="5" fill="#4F5D95" />
      <text class="lang-label" x="20" y="10">PHP</text>
      <text class="lang-pct" x="420" y="10" text-anchor="end">25.8%</text>
    </g>
  </g>
</svg>
